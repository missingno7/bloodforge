[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bloodforge"
version = "0.1.0"
description = "Evidence-driven Blood MAP v7 analysis and construction"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
visual = ["Pillow>=10"]

[project.scripts]
bloodforge = "bloodforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
